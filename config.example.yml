port: 3000

database:
  path: ./data/itinerary.db   # DATABASE_PATH env var overrides this

llm:
  provider: openai
  models:
    extract: gpt-5.6-luna     # Booking email -> itinerary entries
    match: gpt-5.6-luna       # Which trip do the entries belong to?

email:
  # Only emails from these senders (envelope sender or From: header) are imported.
  allowed_senders:
    - you@example.com
